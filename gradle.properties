# Ponder (Create 6.0 split it into a separate mod). Ponder jar also bundles Catnip
# classes (net.createmod.catnip.*) — both are required at compile time.
ponder_version=1.0.66
# KasugaLib dependency (publish KasugaLib to mavenLocal first, or adjust below)
# Kuayue references kasuga.lib.core.create.* (CreateRailway/TrackType/RailwayManager etc.),
# which ONLY exists in the Create flavour. So we depend on the "-create" flavour.
kasuga_lib_version=0.22.1-neoforge-create
# Steam 'n' Rails 1.21.1 — unofficial NeoForge port by PoppyBlossom / Chameleon538.
# Upstream: https://github.com/Porters-of-Railways/Railway-1.21.1
# Modrinth: project id L3Jv0QZI (slug create-steam-n-rails-1.21.1).
# 0.2.1 is the newest RELEASE and its declared dependency ranges are satisfied here:
#   create   [6.0.7,)     <- this project uses create 6.0.8-169
#   neoforge [21.1.233,)  <- this project uses neo 21.1.250
# (0.3.0-* targets Create 6.0.10; use it only after bumping create_version.)
snr_version=0.2.1+neoforge-mc1.21.1
